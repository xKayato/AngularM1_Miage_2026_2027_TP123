<header>
  <div>
    <b>Guitar Practice Cloud</b>
    <small>Le cloud qui manque à votre ampli</small>
  </div>
  <nav aria-label="Navigation principale">
    @if (auth.isAuthenticated()) {
      <a routerLink="/tracks">Backing tracks</a>
      <a routerLink="/profile">
        Profil
        @if (auth.currentUser(); as user) {
          ({{ user.name }})
        }
      </a>
      <button type="button" (click)="logout()" style="background: transparent; border: 1px solid white; padding: 0.3rem 0.6rem; cursor: pointer; color: white; border-radius: 4px;">
        Déconnexion
      </button>
    } @else {
      <a routerLink="/login">Connexion</a>
      <a routerLink="/register">Inscription</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
