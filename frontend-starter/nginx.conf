server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Pièces jointes jusqu'à 25 Mo, plusieurs fichiers par requête (50 Mo cumulés par post)
  client_max_body_size 60m;

  # Même rôle que proxy.conf.json en développement : le navigateur ne parle qu'à une seule origine
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Compression : le JavaScript et le CSS sont 4 à 5 fois plus légers sur le réseau
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

  # Fichiers du build avec empreinte dans le nom (main-AB12CD34.js, chunk-…) : leur contenu
  # ne change jamais sous ce nom, on peut les garder en cache un an.
  location ~* "^/(?:main|chunk|styles|polyfills)-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Tout autre JS / CSS sans empreinte : revalidation à chaque visite (304 si inchangé)
  location ~* \.(?:js|css)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # Images et polices statiques : cache d'une journée
  location ~* \.(?:woff2?|png|jpg|jpeg|svg|ico|webp)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  # Routes Angular (/posts/:id, /share/:token…) : F5 sans 404
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
