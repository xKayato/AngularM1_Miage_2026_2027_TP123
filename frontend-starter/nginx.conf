server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Pièces jointes jusqu'à 25 Mo, plusieurs fichiers par requête (50 Mo cumulés par post)
  client_max_body_size 60m;

  # Même rôle que proxy.conf.json en développement : le navigateur ne parle qu'à une seule origine
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Fichiers du build avec hash : cache long
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Routes Angular (/posts/:id, /share/:token…) : F5 sans 404
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
